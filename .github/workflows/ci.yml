name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check helper/relaybox-helper.mjs

  ffmpeg-selftest:
    name: Real ffmpeg self-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:ffmpeg

  helper:
    name: Build helper artifact
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package single-file helper
        run: |
          mkdir -p dist
          cp helper/relaybox-helper.mjs dist/
          cd dist && sha256sum relaybox-helper.mjs > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: relaybox-helper
          path: dist/

  image:
    name: Build and smoke-test image
    needs: [test, ffmpeg-selftest]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (runs the test stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          load: true
          tags: relaybox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the running container
        run: |
          docker run -d --name relaybox-ci -e API_TOKEN=ci-token-0123456789abcdef -p 3000:3000 relaybox:ci
          for i in $(seq 1 20); do
            curl -fs http://127.0.0.1:3000/health && break
            sleep 1
          done
          curl -fs http://127.0.0.1:3000/health | grep -q '"ok"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/negotiate \
            -H 'Content-Type: application/json' -d '{}')
          test "$code" = "401"
      - name: Show container logs
        if: always()
        run: docker logs relaybox-ci || true
      - name: Remove container
        if: always()
        run: docker rm -f relaybox-ci || true

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, helper]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/download-artifact@v4
        with:
          name: relaybox-helper
          path: dist
      - name: Attach helper to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
