# RelayBox on a home server: the API container plus Caddy for HTTPS.
# The API image is pulled from GitHub Container Registry.
# Only Caddy publishes a port (443). The API is reachable only through Caddy.
services:
  relaybox:
    image: ghcr.io/enderman-claude/relaybox:${RELAYBOX_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
      MAX_BITRATE_KBPS: ${MAX_BITRATE_KBPS:-4000}
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - relaybox
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
